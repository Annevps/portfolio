<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Portfólio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f7f7f5;--card:#fff;--tx:#1c1c1a;--mu:#6b6b66;--bd:#e2e2dd;--ac:#2f5bea;--rd:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#212120;--tx:#f0f0ec;--mu:#9a9a94;--bd:#33332f;--ac:#7b9bff;--rd:#ef7b7b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:20px}
header{display:flex;gap:8px;align-items:center;margin-bottom:24px}
header b{margin-right:auto;font-size:18px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.del{color:var(--rd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:17px}
.card p{margin:0;color:var(--mu);font-size:14px}
.tags span{display:inline-block;font-size:12px;border:1px solid var(--bd);border-radius:20px;padding:1px 9px;margin:0 4px 4px 0;color:var(--mu)}
.card a{color:var(--ac);font-size:14px}
.row{display:flex;gap:8px;margin-top:auto}
form{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;display:grid;gap:10px;margin-bottom:20px}
label{font-size:13px;color:var(--mu);display:grid;gap:4px}
input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
.muted{color:var(--mu)}
.hide{display:none!important}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px}
#modal form{width:100%;max-width:340px;margin:0}
#erro{color:var(--rd);font-size:13px;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <b>Meu Portfólio</b>
    <button id="bProj">Projetos</button>
    <button id="bAdmin" class="hide">Painel</button>
    <button id="bSair" class="hide">Sair</button>
    <button id="bLock" title="Área administrativa" aria-label="Login admin">🔒</button>
  </header>

  <section id="vProj">
    <h2>Projetos</h2>
    <div id="lista" class="grid"><p class="muted">Carregando…</p></div>
  </section>

  <section id="vAdmin" class="hide">
    <h2>Painel administrativo</h2>
    <form id="f">
      <strong id="fTitulo">Novo projeto</strong>
      <label>Título<input id="titulo" required></label>
      <label>Descrição<textarea id="desc" rows="3"></textarea></label>
      <label>Tecnologias (separe por vírgula)<input id="tags"></label>
      <label>Link<input id="link" type="url" placeholder="https://"></label>
      <div class="row">
        <button class="pri" type="submit" id="salvar">Adicionar</button>
        <button type="button" id="cancelar" class="hide">Cancelar edição</button>
      </div>
    </form>
    <div id="admin" class="grid"></div>
  </section>
</div>

<div id="modal" class="hide">
  <form id="login">
    <strong>🔒 Entrar</strong>
    <label>Email<input id="email" type="email" required autocomplete="username"></label>
    <label>Senha<input id="senha" type="password" required autocomplete="current-password"></label>
    <p id="erro"></p>
    <div class="row">
      <button class="pri" type="submit">Entrar</button>
      <button type="button" id="fechar">Fechar</button>
    </div>
  </form>
</div>

<script>
// ====== COLE AQUI OS DADOS DO SEU SUPABASE (Project Settings > API) ======
const SUPABASE_URL = "https://khktnihmmjdnjosnqkls.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_G7eu65EA3s8SrP633y1bDQ_0k-FOSJJ";
// =========================================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let projetos = [], editId = null, logado = false;

const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';

function cardHtml(p, admin){
  const tags = (p.tecnologias || '').split(',').map(t => t.trim()).filter(Boolean).map(t => `<span>${esc(t)}</span>`).join('');
  const url = safeUrl(p.link);
  return `<div class="card"><h3>${esc(p.titulo)}</h3><p>${esc(p.descricao)}</p>
    <div class="tags">${tags}</div>
    ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">Ver projeto ↗</a>` : ''}
    ${admin ? `<div class="row"><button data-edit="${p.id}">Editar</button><button class="del" data-del="${p.id}">Excluir</button></div>` : ''}</div>`;
}

function render(){
  $('lista').innerHTML = projetos.length ? projetos.map(p => cardHtml(p, false)).join('') : '<p class="muted">Nenhum projeto ainda.</p>';
  $('admin').innerHTML = projetos.length ? projetos.map(p => cardHtml(p, true)).join('') : '<p class="muted">Adicione seu primeiro projeto acima.</p>';
}

async function carregar(){
  const { data, error } = await sb.from('projetos').select('*').order('created_at', { ascending: false });
  if (error){ $('lista').innerHTML = '<p class="muted">Erro ao carregar: ' + esc(error.message) + '</p>'; return; }
  projetos = data; render();
}

function show(v){
  $('vProj').classList.toggle('hide', v !== 'proj');
  $('vAdmin').classList.toggle('hide', v !== 'admin');
}
function atualizaSessao(session){
  logado = !!session;
  $('bAdmin').classList.toggle('hide', !logado);
  $('bSair').classList.toggle('hide', !logado);
  $('bLock').classList.toggle('hide', logado);
  if (!logado) show('proj');
}

$('bProj').onclick = () => show('proj');
$('bAdmin').onclick = () => show('admin');
$('bLock').onclick = () => { $('erro').textContent = ''; $('modal').classList.remove('hide'); $('email').focus(); };
$('fechar').onclick = () => $('modal').classList.add('hide');
$('bSair').onclick = () => sb.auth.signOut();

$('login').onsubmit = async e => {
  e.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('senha').value });
  if (error){ $('erro').textContent = 'Email ou senha incorretos.'; return; }
  $('senha').value = ''; $('modal').classList.add('hide'); show('admin');
};

function resetForm(){
  editId = null; $('f').reset();
  $('fTitulo').textContent = 'Novo projeto'; $('salvar').textContent = 'Adicionar';
  $('cancelar').classList.add('hide');
}
$('cancelar').onclick = resetForm;

$('f').onsubmit = async e => {
  e.preventDefault();
  const dados = { titulo: $('titulo').value.trim(), descricao: $('desc').value.trim(), tecnologias: $('tags').value.trim(), link: $('link').value.trim() };
  const { error } = editId ? await sb.from('projetos').update(dados).eq('id', editId) : await sb.from('projetos').insert(dados);
  if (error){ alert('Erro ao salvar: ' + error.message); return; }
  resetForm(); carregar();
};

$('admin').onclick = async e => {
  const ed = e.target.dataset.edit, dl = e.target.dataset.del;
  if (ed){
    const p = projetos.find(x => String(x.id) === ed); if (!p) return;
    editId = p.id;
    $('titulo').value = p.titulo || ''; $('desc').value = p.descricao || '';
    $('tags').value = p.tecnologias || ''; $('link').value = p.link || '';
    $('fTitulo').textContent = 'Editando projeto'; $('salvar').textContent = 'Salvar alterações';
    $('cancelar').classList.remove('hide');
    $('f').scrollIntoView({ behavior: 'smooth' });
  }
  if (dl && confirm('Excluir este projeto?')){
    const { error } = await sb.from('projetos').delete().eq('id', dl);
    if (error) alert('Erro ao excluir: ' + error.message); else carregar();
  }
};

sb.auth.getSession().then(({ data }) => atualizaSessao(data.session));
sb.auth.onAuthStateChange((_ev, session) => atualizaSessao(session));
carregar();
</script>
</body>
</html>
